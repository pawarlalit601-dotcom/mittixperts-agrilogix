services:
  postgres:
    image: postgres:17-alpine
    container_name: agrilogix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agrilogix
      POSTGRES_USER: agrilogix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrilogix_secret_2025}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - agrilogix_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agrilogix -d agrilogix"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agrilogix_postgres_data:
