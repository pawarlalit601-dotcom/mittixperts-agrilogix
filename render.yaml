databases:
  - name: agrilogix-scanner-db
    databaseName: agrilogix
    user: agrilogix
    plan: free
    region: oregon

services:
  - type: web
    name: agrilogix-scanner-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: agrilogix-scanner-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: KYC_ENCRYPTION_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
